name: Build and smoke test

on:
  push:
    branches:
      - improve/osd-layout-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Show toolchain
        shell: pwsh
        run: dotnet --info

      - name: Restore
        run: |
          dotnet restore VoicemeeterSliderControl.csproj
          dotnet restore tools/SmokeTests/SmokeTests.csproj

      - name: Build Release
        run: dotnet build VoicemeeterSliderControl.csproj -c Release --no-restore

      - name: Run smoke tests
        run: dotnet run --project tools/SmokeTests/SmokeTests.csproj -c Release --no-restore

      - name: Publish Windows x64
        run: dotnet publish VoicemeeterSliderControl.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false -o publish

      - name: Create archive
        shell: pwsh
        run: Compress-Archive -Path publish/VoicemeeterSliderControl.exe -DestinationPath VoicemeeterSliderControl-0.0.6-win-x64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoicemeeterSliderControl-0.0.6-win-x64
          path: |
            publish/VoicemeeterSliderControl.exe
            VoicemeeterSliderControl-0.0.6-win-x64.zip
