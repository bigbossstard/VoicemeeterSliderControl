name: Release

on:
  push:
    branches:
      - release/0.0.9

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: |
          dotnet restore VoicemeeterSliderControl.csproj
          dotnet restore tools/SmokeTests/SmokeTests.csproj

      - name: Build Release
        run: dotnet build VoicemeeterSliderControl.csproj -c Release --no-restore

      - name: Run smoke tests
        run: dotnet run --project tools/SmokeTests/SmokeTests.csproj -c Release --no-restore

      - name: Publish Windows x64
        run: dotnet publish VoicemeeterSliderControl.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false -o publish

      - name: Create archive and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path publish/VoicemeeterSliderControl.exe -DestinationPath VoicemeeterSliderControl-0.0.9-win-x64.zip -Force
          $hash = (Get-FileHash publish/VoicemeeterSliderControl.exe -Algorithm SHA256).Hash
          "$hash  VoicemeeterSliderControl.exe" | Set-Content SHA256SUMS.txt
          $hashZip = (Get-FileHash VoicemeeterSliderControl-0.0.9-win-x64.zip -Algorithm SHA256).Hash
          "$hashZip  VoicemeeterSliderControl-0.0.9-win-x64.zip" | Add-Content SHA256SUMS.txt

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseTag = "0.0.9v"
          $releaseTitle = "Voicemeeter Slider Control 0.0.9"
          $releaseNotes = "Исправлены OSD-обозначения виртуальных входов: Strip 5 → Voicemeeter Input, Strip 6 → Voicemeeter AUX 1, Strip 7 → Voicemeeter VAIO3. Плавное отображение Gain сохранено."

          # A failed gh release create can leave an untagged release behind.
          # Remove only such an orphan when it has exactly this release title.
          $orphanReleases = gh release list --repo ${{ github.repository }} --limit 100 --json tagName,name |
            ConvertFrom-Json |
            Where-Object {
              $_.name -eq $releaseTitle -and
              $_.tagName -like "untagged-*"
            }

          foreach ($orphan in $orphanReleases) {
            gh release delete $orphan.tagName --repo ${{ github.repository }} --yes
            if ($LASTEXITCODE -ne 0) {
              throw "Не удалось удалить осиротевший untagged release $($orphan.tagName)."
            }
          }

          gh release view $releaseTag --repo ${{ github.repository }} *> $null

          if ($LASTEXITCODE -eq 0) {
            gh release edit $releaseTag --repo ${{ github.repository }} --title $releaseTitle --notes $releaseNotes
            if ($LASTEXITCODE -ne 0) {
              throw "Не удалось обновить существующий GitHub Release."
            }

            gh release upload $releaseTag publish/VoicemeeterSliderControl.exe VoicemeeterSliderControl-0.0.9-win-x64.zip SHA256SUMS.txt --repo ${{ github.repository }} --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "Не удалось обновить assets существующего GitHub Release."
            }
          }
          else {
            gh release create $releaseTag publish/VoicemeeterSliderControl.exe VoicemeeterSliderControl-0.0.9-win-x64.zip SHA256SUMS.txt --repo ${{ github.repository }} --target release/0.0.9 --title $releaseTitle --notes $releaseNotes
            if ($LASTEXITCODE -ne 0) {
              throw "Не удалось создать GitHub Release."
            }
          }
