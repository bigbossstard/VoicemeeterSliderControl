name: Release

on:
  push:
    tags:
      - "*v"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Validate release tag and application version
        id: version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME

          if ($tag -notmatch '^(?<version>\d+\.\d+\.\d+)v$') {
            throw "Release workflow must run for a version tag like 0.0.10v. Current ref: '$tag'"
          }

          $version = $Matches.version

          [xml]$project = Get-Content VoicemeeterSliderControl.csproj
          $projectVersion = ($project.Project.PropertyGroup.Version | Select-Object -First 1).ToString().Trim()

          if ($projectVersion -ne $version) {
            throw "Version mismatch: git tag is '$version', but VoicemeeterSliderControl.csproj contains '$projectVersion'."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: |
          dotnet restore VoicemeeterSliderControl.csproj
          dotnet restore tools/SmokeTests/SmokeTests.csproj

      - name: Build Release
        run: dotnet build VoicemeeterSliderControl.csproj -c Release --no-restore

      - name: Run smoke tests
        run: dotnet run --project tools/SmokeTests/SmokeTests.csproj -c Release --no-restore

      - name: Publish Windows x64
        run: dotnet publish VoicemeeterSliderControl.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false -o publish

      - name: Create archive and checksum
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $zipName = "VoicemeeterSliderControl-$env:VERSION-win-x64.zip"
          Compress-Archive -Path publish/VoicemeeterSliderControl.exe -DestinationPath $zipName -Force

          $hashExe = (Get-FileHash publish/VoicemeeterSliderControl.exe -Algorithm SHA256).Hash
          "$hashExe  VoicemeeterSliderControl.exe" | Set-Content SHA256SUMS.txt

          $hashZip = (Get-FileHash $zipName -Algorithm SHA256).Hash
          "$hashZip  $zipName" | Add-Content SHA256SUMS.txt

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $releaseTag = $env:RELEASE_TAG
          $releaseTitle = "Voicemeeter Slider Control $env:VERSION"
          $zipName = "VoicemeeterSliderControl-$env:VERSION-win-x64.zip"

          # A failed gh release create can leave an untagged release behind.
          # Remove only such an orphan when it has the exact title for this version.
          $orphanReleases = gh release list --repo ${{ github.repository }} --limit 100 --json tagName,name |
            ConvertFrom-Json |
            Where-Object {
              $_.name -eq $releaseTitle -and
              $_.tagName -like "untagged-*"
            }

          foreach ($orphan in $orphanReleases) {
            gh release delete $orphan.tagName --repo ${{ github.repository }} --yes
            if ($LASTEXITCODE -ne 0) {
              throw "Не удалось удалить осиротевший untagged release $($orphan.tagName)."
            }
          }

          gh release view $releaseTag --repo ${{ github.repository }} *> $null

          if ($LASTEXITCODE -eq 0) {
            gh release edit $releaseTag --repo ${{ github.repository }} --title $releaseTitle
            if ($LASTEXITCODE -ne 0) {
              throw "Не удалось обновить существующий GitHub Release."
            }
          }
          else {
            gh release create $releaseTag --repo ${{ github.repository }} --verify-tag --title $releaseTitle --generate-notes
            if ($LASTEXITCODE -ne 0) {
              throw "Не удалось создать GitHub Release."
            }
          }

          gh release upload $releaseTag publish/VoicemeeterSliderControl.exe $zipName SHA256SUMS.txt --repo ${{ github.repository }} --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Не удалось загрузить assets GitHub Release."
          }
